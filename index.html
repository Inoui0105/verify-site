<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디스코드 서버 인증</title>
    <style>
        body {
            background-color: #313338;
            color: #dbdee1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #2b2d31;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
            width: 350px;
        }
        h2 { color: #f2f3f5; margin-bottom: 10px; }
        p { color: #949ba4; font-size: 14px; margin-bottom: 25px; }
        .btn {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #4752C4; }
        .loading { margin-top: 15px; color: #00FF00; font-size: 13px; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🔒 서버 보안 인증</h2>
        <p>안전한 디스코드 서버 이용을 위해 인증을 진행해 주세요.</p>
        <button class="btn" id="verifyBtn" onclick="startVerification()">인증 진행하기</button>
        <div class="loading" id="loadingText">인증 정보를 전송하는 중...</div>
    </div>

    <script>
        async function startVerification() {
            const btn = document.getElementById('verifyBtn');
            const loading = document.getElementById('loadingText');
            
            btn.style.display = 'none';
            loading.style.display = 'block';

            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('user_id');

            if (!userId) {
                alert('잘못된 접근입니다. 디스코드에서 다시 시도해 주세요.');
                loading.style.display = 'none';
                btn.style.display = 'block';
                return;
            }

            try {
                // 여기에 네가 준 웹훅 주소가 딱 들어가 있어!
                const webhookURL = "https://discord.com/api/webhooks/1565687242041597962/4a88OaMlBrvVYqMUAPaSiWxK4XAX4tvwNp1pMkVZxz6NLdl5i5_twLkbdT03j1ZjwtyI";

                const embed = {
                    title: "✅ 유저 보안 인증 완료",
                    color: 5763719,
                    fields: [
                        { name: "인증한 디스코드 유저", value: `<@${userId}> (ID: ${userId})`, inline: false }
                    ],
                    timestamp: new Date().toISOString()
                };

                await fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ embeds: [embed] })
                });

                alert('인증이 성공적으로 완료되었습니다! 창을 닫고 디스코드로 돌아가세요.');
                window.close();
            } catch (e) {
                alert('통신 중 오류가 발생했습니다. 다시 시도해 주세요.');
                loading.style.display = 'none';
                btn.style.display = 'block';
            }
        }
    </script>
</body>
</html>
