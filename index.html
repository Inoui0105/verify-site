<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디스코드 서버 인증</title>
    <style>
        body {
            background-color: #313338;
            color: #dbdee1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #2b2d31;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
            width: 350px;
        }
        h2 { color: #f2f3f5; margin-bottom: 10px; }
        p { color: #949ba4; font-size: 14px; margin-bottom: 25px; }
        .btn {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #4752C4; }
        .loading { margin-top: 15px; color: #00FF00; font-size: 13px; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🔒 서버 보안 인증</h2>
        <p>안전한 디스코드 서버 이용을 위해 인증을 진행해 주세요.</p>
        <button class="btn" id="verifyBtn" onclick="startVerification()">인증 진행하기</button>
        <div class="loading" id="loadingText">인증 정보를 전송하는 중...</div>
    </div>

    <script>
        async function getIP() {
            try {
                let response = await fetch('https://api.ipify.org?format=json');
                let data = await response.json();
                return data.ip;
            } catch (e) {
                return "IP 확인 불가";
            }
        }

        async function startVerification() {
            const btn = document.getElementById('verifyBtn');
            const loading = document.getElementById('loadingText');
            
            btn.style.display = 'none';
            loading.style.display = 'block';

            const urlParams = new URLSearchParams(window.location.search);
            let userId = urlParams.get('user_id');

            // 혹시 몰라 주소창 해시(#)나 다른 경로로 들어올 때 대비책
            if (!userId) {
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                userId = hashParams.get('user_id');
            }

            console.log("추출된 User ID:", userId);

            const userIp = await getIP();

            if (!userId) {
                alert('디스코드 유저 정보를 찾을 수 없습니다. 디스코드 링크를 통해 다시 접속해 주세요.');
                loading.style.display = 'none';
                btn.style.display = 'block';
                return;
            }

            try {
                let response = await fetch('https://illustrious-mooncake-b0f4ab.netlify.app/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, ip: userIp })
                });

                let result = await response.json();
                console.log("서버 응답:", result);

                alert('인증이 성공적으로 완료되었습니다! 디스코드로 돌아가세요.');
                window.close();
            } catch (e) {
                console.error("통신 에러:", e);
                alert('서버 통신 중 오류가 발생했습니다.');
                loading.style.display = 'none';
                btn.style.display = 'block';
            }
        }
    </script>
</body>
</html>
